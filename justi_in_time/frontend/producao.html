<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produção - Preparação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <div class="topo">

            <h2>Gestão de Produção</h2>

            <a href="principal.html">
                <button>Voltar</button>
            </a>

        </div>

        <div class="formulario">

            <label>Produto</label>

            <select>
                <option>Produto A</option>
                <option>Produto B</option>
                <option>Produto C</option>
            </select>

            <label>Tipo de movimentação</label>

            <select>
                <option>Fabricado</option>
                <option>Pedido</option>
            </select>

            <label>Quantidade</label>

            <input type="number" placeholder="Digite a quantidade">

            <label>Data da movimentação</label>

            <input type="date">

            <button>Registrar movimentação</button>

        </div>

        <h3>Produtos</h3>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Produto</th>
                    <th>Estoque</th>
                    <th>Estoque mínimo</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>1</td>
                    <td>Produto A</td>
                    <td>20</td>
                    <td>5</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Produto B</td>
                    <td>15</td>
                    <td>5</td>
                </tr>

                <tr>
                    <td>3</td>
                    <td>Produto C</td>
                    <td>30</td>
                    <td>10</td>
                </tr>

            </tbody>

        </table>

    </main>

</body>
</html>
